name: Keepalive Supabase

# Planos gratuitos do Supabase pausam o projeto inteiro após 7 dias sem
# nenhuma consulta real ao banco (visita ao dashboard ou só requisição HTTP
# não conta). Este workflow chama a rota GET /health do backend (que faz um
# "SELECT 1" no banco) algumas vezes por semana, bem abaixo do limite de 7
# dias, só pra manter o Supabase ativo.
#
# O backend hoje roda numa VPS própria (Oracle Cloud, via PM2 + Nginx), não
# mais no Render — o PM2 já mantém o processo sempre ativo (sem cold start
# de plano gratuito), então este workflow serve só pro propósito original:
# manter o Supabase fora do pause por inatividade. A variável BACKEND_URL
# (Settings > Secrets and variables > Actions > Variables, no GitHub) precisa
# apontar pro endereço atual da VPS, não mais pra URL antiga do Render.

on:
  schedule:
    # 06:00 UTC às segundas, quartas e sextas — 3x por semana, com folga
    # confortável em relação ao limite de 7 dias do Supabase.
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  ping-health:
    name: Ping GET /health (backend na VPS)
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /health
        run: |
          echo "Chamando ${BACKEND_URL}/health..."
          curl --fail --show-error --silent "${BACKEND_URL}/health"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
