name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Testes do backend (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências (raiz + workspaces)
        run: npm ci

      - name: Rodar testes do backend
        run: npm test --workspace backend

  frontend-build:
    name: Build do frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências (raiz + workspaces)
        run: npm ci

      - name: Build do frontend
        run: npm run build --workspace frontend
